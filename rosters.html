    <script>
        let allRosters = {};
        let groupMappings = {};
        let groupOrder = [];

        document.addEventListener('DOMContentLoaded', async function() {
            initAIAssistant();
            await Promise.all([loadRostersData(), loadTeamsData()]);
            renderRosters();
            initSearch();
            initDetailModal();
        });

        async function loadRostersData() {
            try {
                const response = await fetch('/api/rosters?_=' + Date.now(), { cache: 'no-cache' });
                allRosters = await response.json();
            } catch(e) {
                console.error('加载大名单失败:', e);
                document.getElementById('rostersGrid').innerHTML = '<p style="text-align:center;color:#4a4a5a;">加载失败，请刷新页面</p>';
            }
        }

        async function loadTeamsData() {
            try {
                const response = await fetch('/api/teams?_=' + Date.now(), { cache: 'no-cache' });
                groupMappings = await response.json();
                groupOrder = Object.keys(groupMappings);
            } catch(e) {
                console.error('加载分组信息失败:', e);
            }
        }

        function renderRosters(searchTerm = '') {
            const container = document.getElementById('rostersGrid');

            let html = '';

            groupOrder.forEach(group => {
                const teamsInGroup = groupMappings[group] || [];
                const filteredTeams = searchTerm
                    ? teamsInGroup.filter(name => name.toLowerCase().includes(searchTerm.toLowerCase()))
                    : teamsInGroup;

                if (filteredTeams.length === 0) return;

                html += `
                    <div class="group-section">
                        <div class="group-header">
                            <span class="group-icon">⚽</span>
                            <span class="group-name">${group}</span>
                            <span class="group-team-count">${filteredTeams.length}支球队</span>
                        </div>
                        <div class="group-teams">
                `;

                filteredTeams.forEach(team => {
                    const players = allRosters[team] || [];
                    html += `
                        <div class="team-card" data-team="${team}" onclick="showRosterDetail('${team}')">
                            <div class="team-card-header">
                                <span class="team-icon">👕</span>
                                <h3 class="team-name">${team}</h3>
                            </div>
                            <div class="team-card-footer">
                                <span class="player-count-badge">${players.length} 人</span>
                                <span class="view-detail">查看详情 →</span>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            if (html === '') {
                container.innerHTML = '<p style="text-align:center;color:#4a4a5a;grid-column:1/-1;">未找到匹配的球队</p>';
            } else {
                container.innerHTML = html;
            }
        }

        function initSearch() {
            const searchInput = document.getElementById('teamSearch');
            searchInput.addEventListener('input', function() {
                renderRosters(this.value);
            });
        }

        function showRosterDetail(team) {
            const players = allRosters[team] || [];
            
            const sortedPlayers = players.sort((a, b) => {
                const numA = parseInt(a.number) || 999;
                const numB = parseInt(b.number) || 999;
                return numA - numB;
            });
            
            document.getElementById('detailTeamName').textContent = team;
            document.getElementById('detailPlayerCount').textContent = sortedPlayers.length;
            
            document.getElementById('detailPlayerGrid').innerHTML = sortedPlayers.map((player) => {
                const number = player.number || '';
                const name = player.name || player;
                return `
                <div class="player-card">
                    <span class="player-number">${number ? number : '—'}</span>
                    <span class="player-name">${name}</span>
                </div>
                `;
            }).join('');
            
            document.getElementById('rosterDetailModal').classList.add('active');
        }

        function initDetailModal() {
            const modal = document.getElementById('rosterDetailModal');
            const closeBtn = document.getElementById('rosterDetailClose');
            
            closeBtn.addEventListener('click', () => {
                modal.classList.remove('active');
            });
            
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        }
    </script>

        @keyframes spin { to { transform: rotate(360deg); } }
        
        .roster-detail-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .roster-detail-modal.active { display: flex; }
        
        .roster-detail-content { background: #fff; border-radius: 16px; max-width: 800px; width: 100%; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .roster-detail-header { padding: 24px; border-bottom: 1px solid #f0f2f5; display: flex; align-items: center; gap: 12px; position: relative; }

        .roster-detail-body { padding: 24px; overflow-y: auto; }

        .player-count span { color: #ff6b35; font-size: 20px; font-weight: 900; }
        
        .player-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        
        .player-card { background: #f8f9fa; border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 10px; transition: background 0.2s; }
        .player-card:hover { background: #fff0eb; }
        
        .player-number { width: 28px; height: 28px; background: #ff6b35; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; font-family: monospace; flex-shrink: 0; }
        .player-name { font-weight: 600; color: #1a1a2e; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        @media (max-width: 768px) {
            .group-teams { grid-template-columns: 1fr; }
            .team-card { border-right: none; }
            .group-teams > .team-card:nth-last-child(-n + 4) { border-bottom: 1px solid #f0f2f5; }
            .group-teams > .team-card:last-child { border-bottom: none; }
            .group-teams > .team-card:nth-child(4n) { border-right: none; }
            .player-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
    <script>
function exportRosters() {
    const aoa = [['分组', '球队', '号码', '球员']];
    const groups = groupOrder.length ? groupOrder : Object.keys(groupMappings);
    groups.forEach(function (group) {
        const teams = groupMappings[group] || [];
        teams.forEach(function (team) {
            const players = (allRosters[team] || []).slice().sort(function (a, b) {
                return (parseInt(a.number) || 999) - (parseInt(b.number) || 999);
            });
            players.forEach(function (p) {
                aoa.push([group, team, p.number || '', p.name || p]);
            });
        });
    });
    if (aoa.length <= 1) { alert('暂无可导出的大名单数据'); return; }
    WCExcel.exportAoa('2026新生杯-球队大名单.xlsx', '大名单', aoa, [10, 26, 8, 18]);
}
    </script>
